# PandaWiki 本地开发依赖服务（intranet 镜像版，包含 RAGLite + Qdrant）
# 使用（推荐）：
#   docker compose -f docker-compose.deps.intranet.yml --env-file .env up -d
# 说明：后端/前端在宿主机运行；本 compose 负责启动 PG/NATS/Redis/MinIO/Qdrant/RAGLite。

services:
  postgres:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/postgres-zhparser:17.6-bookworm
    container_name: panda-wiki-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    ports:
      - "5432:5432"
    volumes:
      - panda-wiki-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "panda-wiki", "-d", "panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-nats:2.11.3-alpine
    container_name: panda-wiki-nats-dev
    restart: always
    command: ["nats-server", "-js", "-m", "8222", "--user", "panda-wiki", "--pass", "${NATS_PASSWORD}"]
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-redis:7.4.2-alpine
    container_name: panda-wiki-redis-dev
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - panda-wiki-redis-data:/data

  minio:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: panda-wiki-minio-dev
    restart: always
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ACCESS_KEY: s3panda-wiki
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - panda-wiki-minio-data:/data

  qdrant:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-qdrant:v1.14.1
    container_name: panda-wiki-qdrant-dev
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - panda-wiki-qdrant-data:/qdrant/storage

  raglite:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/raglite:v2.14.1
    container_name: panda-wiki-raglite-dev
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      nats:
        condition: service_started
    environment:
      GIN_MODE: release
      DATABASE_POSTGRESQL_HOST: postgres
      DATABASE_POSTGRESQL_USER: panda-wiki
      DATABASE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_QDRANT_HOST: qdrant
      DATABASE_QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_MINIO_ENDPOINT: minio:9000
      STORAGE_MINIO_ACCESS_KEY_ID: s3panda-wiki
      STORAGE_MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      NATS_URL: nats://nats:4222
      NATS_USER: panda-wiki
      NATS_PASSWORD: ${NATS_PASSWORD}
      EMBEDDER_RPM: 800
      LLM_RPM: 50
    ports:
      - "5050:5050"
    volumes:
      - panda-wiki-raglite-data:/data

  crawler:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/anydoc:v0.9.6
    container_name: panda-wiki-crawler-dev
    restart: always
    init: true
    depends_on:
      nats:
        condition: service_started
      minio:
        condition: service_started
    environment:
      GLOG_GLOBAL_LEVEL: info
      NAMESPACE: anydoc
      MQ_NATS_URL: nats://nats:4222
      MQ_NATS_USER: panda-wiki
      MQ_NATS_PASSWORD: ${NATS_PASSWORD}
      OSS_MINIO_ACCESS_KEY: s3panda-wiki
      OSS_MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      OSS_MINIO_ENDPOINT: minio:9000
    ports:
      - "8080:8080"

volumes:
  panda-wiki-pg-data:
  panda-wiki-redis-data:
  panda-wiki-minio-data:
  panda-wiki-qdrant-data:
  panda-wiki-raglite-data:
