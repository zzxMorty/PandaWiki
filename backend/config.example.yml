# PandaWiki 后端配置示例
# 使用方式：复制为 config.yml 到 backend 目录或 backend/config 目录，按需修改。
# 敏感信息建议通过环境变量覆盖，参见 backend/config/config.go 中 overrideWithEnv。
#
# 本地开发（前端、后端本地运行，其他组件 Docker）：
#   1. 启动依赖：docker compose -f docker-compose.deps.yml up -d
#   2. 使用下方 localhost 值，或在 .env 中设置 PG_DSN、MQ_NATS_SERVER、REDIS_ADDR、S3_ENDPOINT 等

log:
  level: 0  # -4: debug, 0: info, 4: warn, 8: error

http:
  port: 8000

admin_password: ""  # 或通过环境变量 ADMIN_PASSWORD 设置

pg:
  # 本地开发用 localhost:5432，Docker 内网用 panda-wiki-postgres
  dsn: "host=localhost user=panda-wiki password=panda-wiki-secret dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  # 或使用环境变量 PG_DSN 覆盖

mq:
  type: nats
  nats:
    # 本地开发用 nats://localhost:4222，Docker 内网用 nats://169.254.15.13:4222
    server: "nats://localhost:4222"
    user: panda-wiki
    password: ""  # 或 NATS_PASSWORD

rag:
  provider: ct
  ct_rag:
    base_url: "http://localhost:5050"  # 或 RAG_CT_RAG_BASE_URL（RAG 服务需单独部署）
    api_key: "sk-1234567890"

redis:
  # 本地开发用 localhost:6379，Docker 内网用 panda-wiki-redis:6379
  addr: "localhost:6379"
  password: ""  # 或 REDIS_PASSWORD

auth:
  type: jwt
  jwt:
    secret: ""  # 或 JWT_SECRET（本地开发可留空或任意字符串）

s3:
  # 本地开发用 localhost:9000；secret 须与 MinIO 容器 MINIO_ROOT_PASSWORD 一致（现有 -dev 容器为 panda-wiki-secret）
  endpoint: "localhost:9000"
  access_key: "s3panda-wiki"
  secret_key: "panda-wiki-secret"  # 或 S3_SECRET_KEY

sentry:
  enabled: true
  dsn: "https://your-dsn@sentry.example/4"  # 或 SENTRY_DSN

caddy_api: "/app/run/caddy-admin.sock"  # 或 CADDY_API
subnet_prefix: "169.254.15"             # 或 SUBNET_PREFIX
